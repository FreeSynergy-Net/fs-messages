# Release of FreeSynergy Messages on a version tag (fs-release caller, pinned).
name: release
on:
  push: { tags: ["v*"] }
permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write
jobs:
  release:
    uses: FreeSynergy-Net/fs-release/.github/workflows/release.yml@e0aa772a12b91f8a37846b4efef5f44a963a6c47
    with:
      # `fs-messages` holds the server (`fs-messages serve`) and the starter; `fs-messages-simple` is the frontend process.
      binaries: fs-messages,fs-messages-simple
      cargo-package: fs-messages-bin
      name: fs-messages
      kind: app
      app-id: net.freesynergy.Messages
      macos: false
      windows-targets: ""   # Unix sockets and Unix paths for now
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
