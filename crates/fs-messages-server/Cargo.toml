[package]
name = "fs-messages-server"
description = "Cap'n Proto server of FreeSynergy Messages: the contract messenger.capnp (draft 0.3) over a local socket; today it answers what it offers, and nothing more"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# The engine: the contract version is the core's, one source (the model and the store come in as the server grows).
fs-messages-core = { path = "../fs-messages-core" }
# One source per library: the same tags as fs-rpc (it pins fs-types, fs-interfaces and fs-objects by tag itself).
fs-rpc = { git = "https://github.com/FreeSynergy/fs-rpc", tag = "v0.0.2" }
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.27" }
capnp = "0.27"
capnp-rpc = "0.27"
tokio = { version = "1", features = ["rt"] }
